# .github/workflows/uat-deploy.yml

name: CI-CD for UAT

on:
  push:
    branches:
      - main   # or use 'uat' or your deployment branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_KEY: ${{ secrets.EC2_SSH_KEY }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # ----------------------
    # Login to Docker Hub
    # ----------------------
    - name: Login to DockerHub
      run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

    # ----------------------
    # Build and Push Images
    # ----------------------
    - name: Build & push user-service
      run: |
        docker build -t $DOCKERHUB_USERNAME/user-service ./user-service
        docker push $DOCKERHUB_USERNAME/user-service

    - name: Build & push wallet-service
      run: |
        docker build -t $DOCKERHUB_USERNAME/wallet-service ./wallet-service
        docker push $DOCKERHUB_USERNAME/wallet-service

    - name: Build & push product-service
      run: |
        docker build -t $DOCKERHUB_USERNAME/product-service ./product-service
        docker push $DOCKERHUB_USERNAME/product-service

    # ----------------------
    # Deploy to EC2 via SSH
    # ----------------------
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ env.EC2_HOST }}
        username: ${{ env.EC2_USER }}
        key: ${{ env.EC2_KEY }}
        script: |
          cd /home/ubuntu/project-root
          git pull origin main
          docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_PASSWORD
          docker-compose -f docker-compose.uat.yml pull
          docker-compose -f docker-compose.uat.yml up -d --remove-orphans
