name: CI/CD for UAT

on:
  push:
    branches:
      - uat

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, wallet-service, product-service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          IMAGE=${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:uat
          docker build -t $IMAGE ./${{ matrix.service }}
          docker push $IMAGE

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Debug: List files in repo
        run: |
          echo "Root Files:"
          ls -lah
          echo "Deploy Files:"
          ls -lah deploy

      - name: Copy Files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          port: ${{ secrets.EC2_PORT }}
          source: |
            docker-compose.uat.yml
            deploy/ec2-setup.sh
          target: "/home/ec2-user/"

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            cd /home/ec2-user
            chmod +x ec2-setup.sh
            ./ec2-setup.sh

            docker compose -f docker-compose.uat.yml pull
            docker compose -f docker-compose.uat.yml down
            docker compose -f docker-compose.uat.yml up -d
